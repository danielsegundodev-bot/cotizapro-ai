name: Test and publish GitHub Pages redirect

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs so a moved or compromised tag cannot inject code
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify compiled Tailwind CSS is up to date
        run: |
          npm ci --ignore-scripts
          npm run build:css
          git diff --exit-code tailwind.css

      - name: Run security regression tests
        run: python3 -m unittest discover -s tests -v

  publish:
    # GitHub Pages serves the gh-pages branch. The app itself runs on PythonAnywhere, so Pages
    # only gets a redirect page; server code and docs are never published there.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Replace gh-pages content with the redirect page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add ../site origin/gh-pages
          cd ../site
          git rm -rq --ignore-unmatch .
          cp "$GITHUB_WORKSPACE"/pages/index.html "$GITHUB_WORKSPACE"/pages/redirect.js .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "gh-pages already up to date"; exit 0; fi
          git commit -m "publish: redirect page for ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
